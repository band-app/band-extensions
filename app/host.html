<!DOCTYPE html>
<!-- A same-origin host page that frames the GridCraft web build (?host=parent), speaks MCP to it
     over the gridcraft:mcp postMessage bridge and registers every tool it lists on
     document.modelContext. It holds no GridCraft tool names or schemas: they all come from
     tools/list. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GridCraft WebMCP host</title>
  <style>
    html, body { margin: 0; height: 100%; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
<iframe id="app" src="index.html?host=parent"></iframe>
<script>
  // A browser without WebMCP gets a minimal stand-in that only records the tools. An existing
  // document.modelContext (a browser's own, or Band's shim) is never replaced.
  if (!document.modelContext) {
    const tools = new Map();
    Object.defineProperty(document, 'modelContext', {
      configurable: true,
      value: { registerTool(t) { tools.set(t.name, t); }, __tools: tools },
    });
  }

  const frame = document.getElementById('app');
  const pending = new Map();
  const failure = (e) => { window.gridcraftToolsError = String(e); };
  let nextId = 1;
  let ready;
  const started = new Promise((resolve) => { ready = resolve; });

  window.addEventListener('message', (event) => {
    if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
    const m = event.data || {};
    if (m.type === 'gridcraft:ready') ready();
    if (m.type === 'gridcraft:failed') failure(m.error);
    if (m.type === 'gridcraft:mcp' && m.message && pending.has(m.message.id)) {
      pending.get(m.message.id)(m.message);
      pending.delete(m.message.id);
    }
  });

  const send = (message) => frame.contentWindow.postMessage({ type: 'gridcraft:mcp', message }, location.origin);

  // One JSON-RPC request; resolves with the result or rejects with the error.
  async function request(method, params) {
    await started;
    const id = nextId++;
    const reply = await new Promise((resolve) => { pending.set(id, resolve); send({ jsonrpc: '2.0', id, method, params }); });
    if (reply.error) throw new Error(reply.error.message);
    return reply.result;
  }

  // Other pages can talk to the app through this page too: gridcraft:open and gridcraft:save go
  // between the frame and whoever listens on window, so they are not wrapped here.
  window.gridcraftHost = { frame, request };

  (async () => {
    const t0 = performance.now();
    await request('initialize', { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'webmcp-host', version: '0' } });
    send({ jsonrpc: '2.0', method: 'notifications/initialized' });
    const { tools } = await request('tools/list', {});
    for (const t of tools) {
      document.modelContext.registerTool({
        name: t.name,
        description: t.description,
        inputSchema: t.inputSchema,
        execute: (input) => request('tools/call', { name: t.name, arguments: input || {} }),
      });
    }
    window.gridcraftToolsMs = Math.round(performance.now() - t0);
    window.gridcraftToolsReady = tools.length;
  })().catch(failure);
</script>
</body>
</html>
