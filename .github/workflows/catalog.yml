name: Catalog

# Builds the official extension catalog, index.json, from the extensions' releases and uploads it to
# the release tagged `catalog`, creating that release when it is missing. Band's hub reads
#   https://github.com/band-app/band-extensions/releases/download/catalog/index.json
# release.yml calls this after it publishes a release. Run by hand, it regenerates the catalog from
# what is released now (for example after a release was edited or deleted). `publish: false`
# builds the file and keeps it as an artifact.
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the file to the catalog release (when off, only build it and keep it as an artifact)
        type: boolean
        default: true

# Two releases published close together must not upload at the same time.
concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/catalog.mjs --repo "$GITHUB_REPOSITORY" --out dist/index.json
      - run: cat dist/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: dist/index.json
          if-no-files-found: error
      - name: Upload to the catalog release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view catalog >/dev/null 2>&1; then
            gh release create catalog --target "$GITHUB_SHA" --latest=false \
              --title "Extension catalog" \
              --notes "index.json lists the newest release of each extension. Band reads it from this release. Regenerated by the Catalog workflow; do not edit."
          fi
          gh release upload catalog dist/index.json --clobber
