[workspace]
resolver = "3"
members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# GridCraft is consumed only as git dependencies at one pinned rev; see README.md before changing it.
[workspace.dependencies]
gridcraft-engine = { git = "https://github.com/storytold/gridcraft.git", rev = "e6b6b349708a", package = "gridcraft-engine" }
gridcraft-mcp = { git = "https://github.com/storytold/gridcraft.git", rev = "e6b6b349708a", package = "gridcraft-mcp" }
gridcraft-ui-egui = { git = "https://github.com/storytold/gridcraft.git", rev = "e6b6b349708a", package = "gridcraft-ui-egui" }
# These two must resolve to the same versions GridCraft's own Cargo.lock uses at that rev.
egui = "0.36"
eframe = { version = "0.36", default-features = false }
rfd = "0.17"
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }

# Cargo ignores a dependency's profile, so GridCraft's release profile is repeated here.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
