[package]
name = "figcraft-band"
description = "FigCraft as a Band editor extension: the web build, Band's editor protocol and FigCraft's MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "figcraft-band"
path = "src/main.rs"

[[bin]]
name = "tools-json"
path = "src/tools_json.rs"

[dependencies]
band-editor = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }
figcraft-collab-net = { workspace = true }
figcraft-mcp = { workspace = true }
figcraft-ui-egui = { workspace = true }
base64 = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlAnchorElement", "Node", "Blob", "BlobPropertyBag", "ClipboardEvent", "DataTransfer", "File", "FileList", "HtmlInputElement", "EventTarget", "Url", "Location", "MediaQueryList", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType", "Storage"] }
