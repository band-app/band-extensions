[workspace]
resolver = "3"
members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# DeckCraft is consumed only as git dependencies at one pinned rev; see README.md before changing it.
[workspace.dependencies]
band-editor = { path = "../../crates/band-editor" }
deckcraft-engine = { git = "https://github.com/storytold/deckcraft.git", rev = "1eec8b266cba", package = "deckcraft-engine" }
deckcraft-mcp = { git = "https://github.com/storytold/deckcraft.git", rev = "1eec8b266cba", package = "deckcraft-mcp" }
deckcraft-ui-egui = { git = "https://github.com/storytold/deckcraft.git", rev = "1eec8b266cba", package = "deckcraft-ui-egui" }
# These must resolve to the same versions DeckCraft's own Cargo.lock uses at that rev.
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
rfd = "0.17"
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Cargo ignores a dependency's profile, so DeckCraft's release profile is repeated here.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Cargo also ignores a dependency's [patch] section, so DeckCraft's is repeated here. It points egui,
# winit and krilla at the forks DeckCraft builds and tests against. Copy it from DeckCraft's root
# Cargo.toml when upgrading the pinned rev.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.8.2" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
