[package]
name = "wordcraft-band"
description = "WordCraft as a Band editor extension: the web build, Band's editor protocol and WordCraft's MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wordcraft-band"
path = "src/main.rs"

[[bin]]
name = "tools-json"
path = "src/tools_json.rs"

[dependencies]
band-editor = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-fonts = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Event", "EventTarget", "ClipboardEvent", "DataTransfer", "FileList", "File", "DomStringList", "MediaQueryList", "UrlSearchParams"] }
