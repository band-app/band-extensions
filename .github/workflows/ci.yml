name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lists the extensions to build. A change under extensions/<name>/ selects that extension. A change
  # to the shared code (crates/, the workspace files, the scripts, the toolchain, this workflow)
  # selects all of them. A change to anything else, such as the README, selects none.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          fi
          echo "changed files:"; echo "$changed"
          shared='^(crates/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|rustfmt\.toml$|scripts/|\.github/)'
          all="$(ls extensions)"
          if echo "$changed" | grep -Eq "$shared"; then
            picked="$all"
          else
            picked="$(for e in $all; do echo "$changed" | grep -q "^extensions/$e/" && echo "$e"; done || true)"
          fi
          matrix="$(echo "$picked" | grep . | jq -R . | jq -sc 'map({ext: .})' || true)"
          echo "matrix={\"include\":${matrix:-[]}}" >> "$GITHUB_OUTPUT"
          echo "matrix: ${matrix:-[]}"

  build:
    needs: changes
    if: fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # An extension with its own [workspace] in extensions/<name>/Cargo.toml (and its own Cargo.lock)
      # builds from that folder. Every other extension builds in the root workspace.
      - name: Find the Cargo workspace
        id: ws
        run: |
          if grep -q '^\[workspace\]' "extensions/${{ matrix.ext }}/Cargo.toml" 2>/dev/null; then
            echo "dir=extensions/${{ matrix.ext }}" >> "$GITHUB_OUTPUT"
            echo "pkgs=--workspace" >> "$GITHUB_OUTPUT"
            echo "fmt=--all" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "pkgs=-p band-editor -p ${{ matrix.ext }}-band" >> "$GITHUB_OUTPUT"
            echo "fmt=-p band-editor -p ${{ matrix.ext }}-band" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        with:
          workspace: ${{ steps.ws.outputs.dir }}
      - name: Format
        working-directory: ${{ steps.ws.outputs.dir }}
        run: cargo fmt --check ${{ steps.ws.outputs.fmt }}
      - name: Clippy (native)
        working-directory: ${{ steps.ws.outputs.dir }}
        run: cargo clippy ${{ steps.ws.outputs.pkgs }} -- -D warnings
      - name: Clippy (wasm32)
        working-directory: ${{ steps.ws.outputs.dir }}
        run: cargo clippy --target wasm32-unknown-unknown ${{ steps.ws.outputs.pkgs }} -- -D warnings
      - name: Test
        # band-editor is part of the root workspace; an extension with its own workspace only depends on it.
        if: steps.ws.outputs.dir == '.'
        run: cargo test -p band-editor
      - name: Package
        run: scripts/package.sh ${{ matrix.ext }}
      - name: Verify the protocol in headless Chrome
        # GitHub runners have no GPU, so the app renders with SwiftShader (set in verify.mjs).
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright-core
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright-core" node extensions/${{ matrix.ext }}/verify.mjs dist/verify
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ext }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  # One check to require in branch protection. It passes when every build passed or none was needed.
  ci:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes: ${{ needs.changes.result }}, build: ${{ needs.build.result }}"
          [ "${{ needs.changes.result }}" = success ] && { [ "${{ needs.build.result }}" = success ] || [ "${{ needs.build.result }}" = skipped ]; }
