[package]
name = "gridcraft-band"
description = "GridCraft as a Band editor extension: the web build, Band's editor protocol and GridCraft's MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "gridcraft-band"
path = "src/main.rs"

[[bin]]
name = "tools-json"
path = "src/tools_json.rs"

[dependencies]
band-editor = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-mcp = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Clipboard", "ClipboardItem", "Navigator"] }
